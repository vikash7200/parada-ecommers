<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Equal Card Slider</title>
  
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <!-- Owl Carousel CSS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/OwlCarousel2/2.3.4/assets/owl.carousel.min.css"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/OwlCarousel2/2.3.4/assets/owl.theme.default.min.css"/>
  
  <style>
    .card {
      border: none;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      overflow: hidden;
      height: 350px; /* Equal height for all cards */
    }

    .card-img-top {
      height: 200px;
      object-fit: cover;
    }

    .card-body {
      height: 150px;
    }

    .owl-carousel .owl-item {
      padding-right: 20px;
    }

    .slider-container {
      overflow: hidden;
      padding-right: 80px; /* to show 4th card partially */
    }
  </style>
</head>
<body>

<div class="container mt-5">
  <div class="slider-container">
    <div class="owl-carousel owl-theme">
      
      <!-- 8 Cards -->
      <!-- Repeat for each -->
      <div class="card">
        <img src="https://via.placeholder.com/300x200" class="card-img-top" alt="1">
        <div class="card-body">
          <h5 class="card-title">Card 1</h5>
          <p class="card-text">This is card 1</p>
        </div>
      </div>

      <div class="card">
        <img src="https://via.placeholder.com/300x200" class="card-img-top" alt="2">
        <div class="card-body">
          <h5 class="card-title">Card 2</h5>
          <p class="card-text">This is card 2</p>
        </div>
      </div>

      <div class="card">
        <img src="https://via.placeholder.com/300x200" class="card-img-top" alt="3">
        <div class="card-body">
          <h5 class="card-title">Card 3</h5>
          <p class="card-text">This is card 3</p>
        </div>
      </div>

      <div class="card">
        <img src="https://via.placeholder.com/300x200" class="card-img-top" alt="4">
        <div class="card-body">
          <h5 class="card-title">Card 4</h5>
          <p class="card-text">This is card 4</p>
        </div>
      </div>

      <div class="card">
        <img src="https://via.placeholder.com/300x200" class="card-img-top" alt="5">
        <div class="card-body">
          <h5 class="card-title">Card 5</h5>
          <p class="card-text">This is card 5</p>
        </div>
      </div>

      <div class="card">
        <img src="https://via.placeholder.com/300x200" class="card-img-top" alt="6">
        <div class="card-body">
          <h5 class="card-title">Card 6</h5>
          <p class="card-text">This is card 6</p>
        </div>
      </div>

      <div class="card">
        <img src="https://via.placeholder.com/300x200" class="card-img-top" alt="7">
        <div class="card-body">
          <h5 class="card-title">Card 7</h5>
          <p class="card-text">This is card 7</p>
        </div>
      </div>

      <div class="card">
        <img src="https://via.placeholder.com/300x200" class="card-img-top" alt="8">
        <div class="card-body">
          <h5 class="card-title">Card 8</h5>
          <p class="card-text">This is card 8</p>
        </div>
      </div>

    </div>
  </div>
</div>

<!-- jQuery -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

<!-- Owl Carousel JS -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/OwlCarousel2/2.3.4/owl.carousel.min.js"></script>

<script>
  $(document).ready(function(){
    $('.owl-carousel').owlCarousel({
        loop: false,
        margin: 20,
        nav: false,
        responsive:{
            0:{
                items:1.2
            },
            768:{
                items:2.2
            },
            992:{
                items:3.4  // 3 full + partial of 4th
            }
        }
    });
  });
</script>

</body>
</html>
