<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Responsive Card Slider</title>

</head>

<style>
.info-section {
  padding: 20px 0;
  background: #f9f9f9;
}

.info-container {
  max-width: 1500px;
  margin: auto;
  display: flex;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: nowrap;
  overflow-x: auto; /* in case screen chhoti ho */
}

.info-card {
  flex: 0 0 249px;
  height: 202px;
  background: #ffffff;
  border: 1px solid #ddd;
  text-align: center;
  padding: 20px;
  box-sizing: border-box;
  box-shadow: 0 2px 5px rgba(0,0,0,0.05);
  display: flex;
  flex-direction: column;
  justify-content: center;
}

.info-card img {
  width: 40px;
  height: 40px;
  margin: 0 auto 10px;
}

.info-card h4 {
  font-size: 18px;
  margin-bottom: 10px;
}

.info-card p {
  font-size: 14px;
  color: #555;
}


</style>
<body>

 <div class="info-section">
  <div class="info-container">
    <div class="info-card">
      <img src="./icons/icon1.svg" alt="Locally Owned">
      <h4>Locally Owned</h4>
      <p>We have local business and sell best quality clothes</p>
    </div>
    <div class="info-card">
      <img src="./icons/icon2.svg" alt="Fast Delivery">
      <h4>Fast Delivery</h4>
      <p>We provide fast delivery to our customers</p>
    </div>
    <div class="info-card">
      <img src="./icons/icon3.svg" alt="Easy Return">
      <h4>Easy Return</h4>
      <p>We provide easy return policy.</p>
    </div>
    <div class="info-card">
      <img src="./icons/icon4.svg" alt="Online Support">
      <h4>Online Support</h4>
      <p>We give 24×7 online support</p>
    </div>
    <div class="info-card">
      <img src="./icons/icon5.svg" alt="Best Offers">
      <h4>Best Offers</h4>
      <p>We give best offers to our customers</p>
    </div>
  </div>
 </div>





</body>

</html>
