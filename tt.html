<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trending Offers</title>

  <!-- Splide CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@splidejs/splide@4.1.3/dist/css/splide.min.css" />

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background: #f9f9f9;
    }

    .theemheader-title {
      text-align: center;
      font-size: 32px;
      font-weight: bold;
      margin-bottom: 30px;
    }

    .splide {
      margin: auto;
      overflow: visible;
    }

    .splide__slide {
      transform: scale(0.85);
      opacity: 0.5;
      transition: transform 0.5s ease, opacity 0.5s ease;
    }

    .splide__slide.is-active {
      transform: scale(1.05);
      opacity: 1;
      z-index: 2;
    }

    .splide__slide.is-active:hover {
      transform: scale(1.12);
    }

    .offer-card {
      background: white;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
      display: flex;
      flex-direction: row-reverse;
      align-items: center;
      height: 300px;
      border-radius: 12px;
      overflow: hidden;
    }

    .offer-card img.offer-image {
      height: 100%;
      width: 50%;
      object-fit: cover;
    }

    .offer-card .text {
      width: 50%;
      text-align: center;
      padding: 20px;
      box-sizing: border-box;
    }

    .levis-icon4 {
      width: 100px;
      height: auto;
      object-fit: contain;
      display: block;
      margin: 0 auto 16px;
    }

    .offer-card p {
      font-family: 'Libre Baskerville', serif;
      font-weight: 700;
      font-size: 32px;
      margin: 0 0 16px;
    }

    .offer-card button {
      width: 172px;
      height: 48px;
      border-radius: 10px;
      border: 2px solid black;
      background: transparent;
      font-family: 'Libre Baskerville', serif;
      font-weight: 400;
      font-size: 20px;
      color: #000;
      cursor: pointer;
    }

    /* Responsive Fix */
   @media (max-width: 864px) {
  .offer-card {
    flex-direction: column;
    height: auto;
  }

  .offer-card img.offer-image {
    width: 100%;
    height: auto; /* 👈 FIXED: allow image to resize naturally */
    object-fit: cover;
  }

  .offer-card .text {
    width: 100%;
    padding: 15px;
  }

  .levis-icon4 {
    width: 60px;
    margin-bottom: 10px;
  }

  .offer-card p {
    font-size: 20px;
    margin-bottom: 10px;
  }

  .offer-card button {
    font-size: 14px;
    width: 120px;
    height: 40px;
  }
}

  </style>
</head>
<body>

  <section class="trending-offers mt-5 mb-5">
    <h4 class="theemheader-title">Trending Offers</h4>
    <div class="splide js-carousel-01" aria-label="Trending Offers">
      <div class="splide__track">
        <ul class="splide__list">
          <li class="splide__slide">
            <div class="offer-card">
              <img class="offer-image" src="./images/trending1.jpg" alt="H&M Offer" />
              <div class="text">
                <img class="levis-icon4" src="./images/Group 47484.jpg" alt="Levis Icon" />
                <p>Min 40% off</p>
                <button type="button">Explore</button>
              </div>
            </div>
          </li>
          <li class="splide__slide">
            <div class="offer-card">
              <img class="offer-image" src="./images/trending1.jpg" alt="Levi's Offer" />
              <div class="text">
                <img class="levis-icon4" src="./images/Group 47484.jpg" alt="Levis Icon" />
                <p>Min 40% off</p>
                <button type="button">Explore</button>
              </div>
            </div>
          </li>
          <li class="splide__slide">
            <div class="offer-card">
              <img class="offer-image" src="./images/trending1.jpg" alt="Zara Offer" />
              <div class="text">
                <img class="levis-icon4" src="./images/Group 47484.jpg" alt="Levis Icon" />
                <p>Min 40% off</p>
                <button type="button">Explore</button>
              </div>
            </div>
          </li>
        </ul>
      </div>
    </div>
  </section>

  <!-- Splide JS -->
  <script src="https://cdn.jsdelivr.net/npm/@splidejs/splide@4.1.3/dist/js/splide.min.js"></script>
  <script>
    new Splide(".js-carousel-01", {
      type: "loop",
      perPage: 2,
      focus: "center",
      gap: "20px",
      pagination: false,
      arrows: true,
      breakpoints: {
        768: {
          perPage: 1,
          focus: "center"
        }
      }
    }).mount();
  </script>
</body>
</html>
